name: Cross-Platform Java CI

on:
  push:
    branches: [ "phuong" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Sử dụng biến matrix.os để tự động thay đổi hệ điều hành
    runs-on: ${{ matrix.os }}

    strategy:
      # Nếu 1 OS lỗi, các OS khác vẫn tiếp tục chạy
      fail-fast: false
      matrix:
        # Cấu hình mảng 3 hệ điều hành yêu cầu
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run test with Maven
        run: mvn -B test
